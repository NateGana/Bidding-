 return S.projects.filter(p=>p.name.toLowerCase().includes(q)&&(f=='All'||(f=='Closing Soon'?pst(p)==f:p.status==f))).map(p=>`<div class="card">${bd(pst(p))}<h3 style="margin-top:8px">${p.name}</h3><div class="mu">Client: ${p.client}</div><div>Budget: <b>${fm(p.budget)}</b> · Open Bidding</div><div class="mu">Deadline: ${dl(p.deadline)} · Bidders: ${nb(p)}</div><div class="sot">Source of Truth: Submitted Bid & Evaluation</div><div class="act" style="justify-content:flex-start"><button class="btn s g" onclick="viewP(${p.id})">View Details</button><button class="btn s" ${p.status=='Open'?'':'disabled'} onclick="subBid(${p.id})">Submit Bid</button></div></div>`).join('')||'<p class="mu">No biddings match. Clear the search or filter.</p>'};
function viewP(id){const p=P(id);openM(`<h3>${p.name}</h3>${bd(pst(p))}<p>${p.desc}</p><p><b>Client:</b> ${p.client}<br><b>Project value:</b> ${fm(p.budget)}<br><b>Bidding method:</b> Open Bidding<br><b>Deadline:</b> ${dl(p.deadline)}<br><b>Bidders:</b> ${nb(p)}</p><b>Requirements / Scope of Work</b><ul class="l">${p.reqs.map(r=>`<li>${r}</li>`).join('')}</ul><p><b>Deliverables:</b> Working system, source code, documentation, test report, deployment plan.</p><b>Evaluation Criteria</b><p class="mu">Price 30% · Technical Approach 25% · Experience 20% · Team Capability 15% · Timeline 10%. The lowest price does not automatically win.</p><b>Current Bidders</b><ul class="l">${S.bids.filter(b=>b.pid==id).map(b=>`<li>${b.company}: ${fm(b.amount)} ${bd(b.status)}</li>`).join('')||'<li>No bids yet.</li>'}</ul><div class="act"><button class="btn g" onclick="closeM()">Close</button><button class="btn g" onclick="closeM();go('eval');$('ps').value=${id};$('ev').innerHTML=ev()">View Evaluation</button><button class="btn" ${p.status=='Open'?'':'disabled'} onclick="subBid(${id})">Submit Bid</button></div>`)}
function subBid(pid){const p=P(pid);formM('Submit Bid: '+p.name,[['company','Company Name','text',1],['contact','Contact Person','text',1],['email','Email','email',1],['phone','Phone','tel',1],['amount','Bid Amount (₱)','number',1],['months','Estimated Completion (months)','number',1],['approach','Technical Approach','textarea',1],['exp','Company Experience','textarea',1],['team','Team Members','textarea',1],['notes','Additional Notes','textarea'],['file','Upload Proposal (simulated, stays in your browser)','file']],d=>{
 if(!(+d.amount>0)){toast('Enter a bid amount greater than 0');return false}
 const b={id:'BID-2026-'+String(S.bids.length+1).padStart(3,'0'),pid,company:d.company,amount:+d.amount,tech:0,exp:0,team:0,time:0,status:'Pending Evaluation',months:+d.months,comment:'',file:d.file&&d.file.name||'(no file)'};
 S.bids.push(b);log(`New bid submitted by ${b.company} (${b.id}) for ${p.name}`);save();toast('Bid submitted: status Pending Evaluation');render()},'Submit Bid')}
/* ===== EVALUATION ===== */
V.eval=()=>`<div class="tools"><select id="ps" onchange="$('ev').innerHTML=ev()">${S.projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select><span class="sp"></span><span class="sot">Source of Truth: Submitted Bid & Evaluation</span></div><div class="card" id="ev">${ev()}</div>`;
const ev=()=>{const pid=+($('ps')?.value||1),bs=S.bids.filter(b=>b.pid==pid).sort((a,b)=>(+overall(b)||0)-(+overall(a)||0));
 return `<p class="mu">Weights: Price 30% · Technical 25% · Experience 20% · Team 15% · Timeline 10%. Scores are inputs for the evaluator; the system never selects a winner on its own.</p>`+tbl(['Bid','Company','Amount','Price','Tech','Exp','Team','Timeline','Overall','Status','Action'],bs.map(b=>[b.id,b.company,fm(b.amount),price(b),b.tech||'—',b.exp||'—',b.team||'—',b.time||'—','<b>'+overall(b)+'</b>',bd(b.status),`<button class="btn s g" onclick="evalB('${b.id}')">Evaluate</button> ${b.status=='Approved'&&!S.orders.some(o=>o.bid==b.id)?`<button class="btn s" onclick="mkOrder('${b.id}')">Create Order</button>`:''}`]))};
function evalB(id){const b=B(id);formM(`Evaluate ${b.company} (${b.id})`,[['tech','Technical Approach (0-100)','number',1,b.tech],['exp','Experience (0-100)','number',1,b.exp],['team','Team Capability (0-100)','number',1,b.team],['time','Timeline (0-100)','number',1,b.time],['comment','Evaluator Comments','textarea',0,b.comment],['st','Decision','select',0,'',['Under Evaluation','Pending','Recommended','Rejected','Approved']]],d=>{
 const v=[d.tech,d.exp,d.team,d.time].map(Number);if(v.some(x=>x<0||x>100||isNaN(x))){toast('Scores must be between 0 and 100');return false}
 if(d.st=='Approved'){if(S.bids.some(x=>x.pid==b.pid&&x.status=='Approved'&&x.id!=b.id)){toast('Another bid is already approved for this project');return false}if(!confirm(`Approve ${b.company} as Selected Provider for ${fm(b.amount)}?`))return false}
 [b.tech,b.exp,b.team,b.time]=v;b.comment=d.comment;b.status=d.st=='Pending'?'Pending Evaluation':d.st;
 log(`Evaluator updated scores for ${b.id} (${b.company}); status: ${b.status}`);
 if(b.status=='Approved'){P(b.pid).status='Awarded';log(`Bid ${b.id} approved. Project awarded to ${b.company}`)}save();toast('Evaluation saved');render();$('ps').value=b.pid;$('ev').innerHTML=ev()},'Save Evaluation')}
/* ===== ORDERS ===== */
const nextOid=()=>'ORD-2026-'+String(S.orders.length+1).padStart(3,'0');
function reserve(o){const i=I(o.sku);if(!i)return toast('Item not found');if(i.stock-i.res>=o.qty){i.res+=o.qty;o.res=true;log(`Stock reserved for Order ${o.id}: ${o.qty} x ${i.name}`);save();return true}toast(`Only ${i.stock-i.res} ${i.name} available; need ${o.qty}`);return false}
function mkOrder(bid){const b=B(bid),p=P(b.pid);if(S.orders.some(o=>o.bid==bid))return toast('Order already exists');
 const o={id:nextOid(),client:p.client,service:p.name,bid:b.id,amount:b.amount,date:new Date().toISOString().slice(0,10),status:'Pending',provider:b.company,sku:p.sku,qty:p.qty,res:false};S.orders.push(o);
 log(`Approved bid ${b.id} converted to Order ${o.id}`);save();const ok=reserve(o);toast(ok?`Order ${o.id} created; stock reserved`:`Order ${o.id} created; stock not reserved`);go('orders');ordM(o.id)}
V.orders=()=>`<div class="tools"><button class="btn" onclick="newOrd()">New Order</button><span class="sp"></span><span class="sot">Source of Truth: Approved Order</span></div><div class="card">${tbl(['Order ID','Client','Service','Bid Ref','Amount','Date','Status','Provider','Stock Requirement',''],S.orders.map(o=>[o.id,o.client,o.service,o.bid,fm(o.amount),o.date,bd(o.status),o.provider,`${o.qty} x ${o.sku} ${o.res?'(reserved)':'(not reserved)'}`,`<button class="btn s g" onclick="ordM('${o.id}')">Open</button>`]))}</div>`;
function newOrd(){formM('New Order',[['client','Client','text',1],['service','Service','text',1],['amount','Amount (₱)','number',1],['sku','Stock item','select',0,'',S.inv.map(i=>i.sku)],['qty','Quantity','number',1,1]],d=>{const o={id:nextOid(),client:d.client,service:d.service,bid:'—',amount:+d.amount,date:new Date().toISOString().slice(0,10),status:'Pending',provider:'Meridian Logistics',sku:d.sku,qty:+d.qty,res:false};S.orders.push(o);log(`Order ${o.id} created for ${o.client}`);save();toast('Order created');render()})}
function ordM(id){const o=S.orders.find(x=>x.id==id),i=I(o.sku);openM(`<h3>${o.id}</h3>${bd(o.status)}<p><b>Client:</b> ${o.client}<br><b>Service:</b> ${o.service}<br><b>Bid reference:</b> ${o.bid}<br><b>Amount:</b> ${fm(o.amount)}<br><b>Date:</b> ${o.date}<br><b>Assigned provider:</b> ${o.provider}</p><div class="sot">Source of Truth: Approved Order</div><p><b>Stock check:</b> ${o.qty} x ${i?i.name:o.sku}. Available now: ${i?i.stock-i.res:'?'} · Reserved for this order: ${o.res?'Yes':'No'}</p><label>Update status<select id="os">${['Pending','Confirmed','Processing','Completed','Cancelled'].map(s=>`<option ${s==o.status?'selected':''}>${s}</option>`).join('')}</select></label><div class="act"><button class="btn g" onclick="closeM()">Close</button>${o.res?`<button class="btn g" onclick="relOrd('${o.id}')">Release Stock</button>`:`<button class="btn g" onclick="if(reserve(S.orders.find(x=>x.id=='${o.id}')))ordM('${o.id}')">Reserve Stock</button>`}<button class="btn" onclick="setOs('${o.id}')">Save Status</button></div>`)}
function setOs(id){const o=S.orders.find(x=>x.id==id);o.status=$('os').value;log(`Order ${id} status set to ${o.status}`);save();toast('Order updated');closeM();render()}
function relOrd(id){const o=S.orders.find(x=>x.id==id);I(o.sku).res-=o.qty;o.res=false;log(`Stock released for Order ${id}`);save();toast('Stock released');closeM();render()}
/* ===== INVENTORY ===== */
V.inv=()=>`<div class="tools"><button class="btn" onclick="addItem()">Add Item</button><span class="sp"></span><span class="sot">Source of Truth: Current Stock</span></div><div class="card"><p class="mu" style="margin-top:0">Inventory / Stock Management is the authoritative record for stock availability.</p>${tbl(['Item','SKU','Category','Current Stock','Reserved','Available','Reorder Level','Status','Actions'],S.inv.map(i=>[i.name,i.sku,i.cat,i.stock.toLocaleString(),i.res.toLocaleString(),(i.stock-i.res).toLocaleString(),i.re,bd(ist(i)),['add','remove','reserve','release'].map(a=>`<button class="btn s g" onclick="stockOp('${i.sku}','${a}')">${a[0].toUpperCase()+a.slice(1)}</button>`).join(' ')]))}</div>`;
function addItem(){formM('Add Inventory Item',[['name','Item','text',1],['sku','SKU','text',1],['cat','Category','text',1],['stock','Opening Stock','number',1,0],['re','Reorder Level','number',1,10]],d=>{if(I(d.sku)){toast('SKU already exists');return false}S.inv.push({name:d.name,sku:d.sku,cat:d.cat,stock:+d.stock,res:0,re:+d.re});log(`Inventory item added: ${d.name} (${d.sku})`);save();toast('Item added');render()})}
function stockOp(sku,a){const i=I(sku);formM(`${a[0].toUpperCase()+a.slice(1)} stock: ${i.name}`,[['q','Quantity','number',1,1]],d=>{const q=+d.q;if(!(q>0)){toast('Enter a quantity above 0');return false}
 if(a=='add')i.stock+=q;else if(a=='remove'){if(i.stock-q<i.res){toast('Cannot remove reserved stock. Release it first');return false}i.stock-=q}
 else if(a=='reserve'){if(q>i.stock-i.res){toast('Not enough available stock');return false}i.res+=q}
 else{if(q>i.res){toast('Cannot release more than reserved');return false}i.res-=q}
 log(`Inventory ${a}: ${q} x ${i.name} (now ${i.stock} in stock, ${i.res} reserved)`);save();toast('Stock updated');render()})}
/* ===== CLIENTS ===== */
V.clients=()=>`<div class="tools"><button class="btn" onclick="addClient()">Add Client</button><span class="sp"></span><span class="mu">Replaces face-to-face and word-of-mouth contact tracking</span></div><div class="card">${tbl(['Company','Industry','Contact','Email','Phone','Address','Services Needed','Relationship','Last Transaction'],S.clients.map(c=>[c.name,c.ind,c.contact,c.email,c.phone,c.addr,c.needs,bd(c.rel.split(' (')[0])+(c.rel.includes('(')?' <span class="mu">'+c.rel.match(/\((.*)\)/)[1]+'</span>':''),c.last]))}</div>`;
function addClient(){formM('Add Client',[['name','Company Name','text',1],['ind','Industry','text',1],['contact','Contact Person','text',1],['email','Email','email',1],['phone','Phone','tel'],['addr','Business Address','text'],['needs','Services Needed','text'],['rel','Relationship Status','select',0,'',['Prospect','Active']]],d=>{S.clients.push({...d,last:'—'});log(`Client added: ${d.name}`);save();toast('Client added');render()})}
/* ===== SERVICES / PROFILE ===== */
V.services=()=>`<div class="grid g2">${S.services.map(s=>`<div class="card"><h3>${s.name}</h3><p class="mu" style="margin:0 0 8px">${s.desc}</p><b>${s.price}</b><br>${bd(s.avail)} <span class="mu">${s.cat}</span></div>`).join('')}</div>`;
V.profile=()=>{const c=S.co;return `<div class="card" style="max-width:640px"><div style="width:64px;height:64px;border-radius:12px;background:var(--pr);color:#fff;font:800 26px/64px sans-serif;text-align:center">ML</div><h2>${c.name}</h2><p>${c.desc}</p><p>${c.addr}<br>${c.email} · ${c.phone}<br>${c.web}</p><b>Services</b><ul class="l">${S.services.map(s=>`<li>${s.name}</li>`).join('')}</ul><p class="mu">Digital version of the traditional business card introduction.</p><button class="btn" onclick="try{navigator.clipboard.writeText('https://${c.web}')}catch(e){}toast('Company profile link copied.')">Share Company Profile</button></div>`};
/* ===== GMAIL SIMULATION ===== */
V.req=()=>`<div class="tools"><span class="bd a">SIMULATION: Gmail Integration</span><span class="mu">No real Gmail connection. Sample emails only.</span></div><div class="grid g2">${S.reqs.map(r=>`<div class="card">${bd(r.status)}<h3 style="margin-top:8px">${r.subj}</h3><div class="mu">From: ${r.from}</div><p>${r.body}</p><div>Quantity: <b>${r.qty}</b> · Requested date: ${r.date}</div><div class="act" style="justify-content:flex-start"><button class="btn s" ${r.status=='New'?'':'disabled'} onclick="conv(${r.id})">Convert to Order Request</button></div></div>`).join('')}</div>`;
function conv(id){const r=S.reqs.find(x=>x.id==id),o={id:nextOid(),client:r.from,service:r.subj,bid:'—',amount:r.est,date:new Date().toISOString().slice(0,10),status:'Pending',provider:'Meridian Logistics',sku:r.sku,qty:r.qty,res:false};
 S.orders.push(o);r.status='Converted';log(`Email request from ${r.from} converted to order request ${o.id}`);save();toast(`Order request ${o.id} created (Pending)`);render()}
/* ===== LOG / SETTINGS ===== */
V.log=()=>`<div class="card">${S.log.map(l=>`<li class="lg"><b>${ft(l.t)}</b> ${l.m}</li>`).join('')}</div>`;
V.set=()=>`<div class="grid g2"><div class="card"><h3>Company Information</h3><label>Name<input id="s1" value="${S.co.name}"></label><label>Email<input id="s2" value="${S.co.email}"></label><label>Phone<input id="s3" value="${S.co.phone}"></label><button class="btn" onclick="S.co.name=$('s1').value;S.co.email=$('s2').value;S.co.phone=$('s3').value;save();toast('Settings saved')">Save changes</button></div>
<div class="card"><h3>System</h3><p>Currency: PHP (₱)<br>Timezone: Asia/Manila</p><p>Default criteria: Price 30 · Technical 25 · Experience 20 · Team 15 · Timeline 10<br>Inventory: low stock when available ≤ reorder level<br>Notifications: on-screen toasts</p><button class="btn g" onclick="theme()">Switch Light / Dark</button> <button class="btn r" onclick="resetData()">Reset Demo Data</button></div></div>`;
/* ===== THEME / ONLINE / INIT ===== */
function applyTheme(){document.documentElement.dataset.theme=S.theme}
function theme(){S.theme=S.theme=='dark'?'light':'dark';save();applyTheme()}
function net(){const on=navigator.onLine;$('net').className=on?'':'off';$('nt').textContent=on?'ONLINE':'OFFLINE';$('nx').textContent='Offline mode enabled: local browser data is being used.'}
addEventListener('online',net);addEventListener('offline',net);
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeM()});
applyTheme();net();render();
</script></body></html>
